name: Java CI

on:
  push:
    branches: "master"


jobs:
  build deploy:
    name: build and deploy 1.0.0

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: unit tests
        run: mvn -B test --file pom.xml

      - name: Build the appliction
        run:
          mvn clean
          mvn -B package --file pom.xml